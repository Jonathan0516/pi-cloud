# OpenSandbox server configuration for the Phase 1 EC2 host (Docker runtime).
# Secrets come from the environment: OPENSANDBOX_SERVER_API_KEY, OPENSANDBOX_STORE_POSTGRESQL_DSN.
# Reference: https://github.com/opensandbox-group/OpenSandbox/blob/main/server/configuration.md

[server]
# The server runs on the host network; control-plane containers reach it through host.docker.internal.
# The EC2 security group must not expose this port; the API key is the second lock.
host = "0.0.0.0"
port = 8080
max_sandbox_timeout_seconds = 86400

[log]
level = "INFO"

[runtime]
type = "docker"
execd_image = "opensandbox/execd:v1.1.0"

[storage]
# Session workspaces live here on the host and are bind-mounted into sandboxes at /workspace.
allowed_host_paths = ["/data/workspaces"]

[store]
type = "postgresql"

[docker]
# Bridge mode is required for outbound network policy and for the proxy to reach sandbox IPs.
network_mode = "bridge"
port_range_min = 40000
port_range_max = 60000
drop_capabilities = ["AUDIT_WRITE", "MKNOD", "NET_ADMIN", "NET_RAW", "SYS_ADMIN", "SYS_MODULE", "SYS_PTRACE", "SYS_TIME", "SYS_TTY_CONFIG"]
no_new_privileges = true
pids_limit = 4096
seccomp_profile = ""

# gVisor for every sandbox: tenants share this host, so a kernel boundary is not optional.
# user-data.sh installs runsc and registers it with Docker. Remove this table only on a single-tenant test host.
[secure_runtime]
type = "gvisor"
docker_runtime = "runsc"

[ingress]
mode = "direct"

[egress]
image = "opensandbox/egress:v1.1.7"
mode = "dns"
readiness_timeout_seconds = 30.0

[renew_intent]
enabled = false
min_interval_seconds = 60

[proxy]
# On the host network the server routes to sandbox bridge IPs directly.
resolve_internal = true
